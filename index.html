<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FKS PUBG SHOP</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border-bottom: 1px solid #222;
        }
        .container {
            padding: 15px;
            display: none;
        }
        .container.active {
            display: block;
        }
        .banner {
            background: linear-gradient(135deg, #2b1111, #141414);
            border: 1px solid #ff2222;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #ff5555;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .game-card {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card:active {
            border-color: #ff2222;
        }
        .game-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .menu-btn {
            background: #161616;
            border: 1px solid #2a2a2a;
            color: white;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-btn:active {
            border-color: #ff2222;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #141414;
            border: 1px solid #ff2222;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(255, 34, 34, 0.2);
        }
        .input-box {
            width: 100%;
            background: #1f1f1f;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .action-btn {
            background: #ff2222;
            color: white;
            font-weight: bold;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .card-number {
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #ff5555;
            margin: 12px 0;
            cursor: pointer;
        }
        .timer {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #ff3333;
            margin: 10px 0;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 999;
        }
        .nav-item {
            color: #777;
            text-align: center;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ff2222;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <b>FKS PUBG SHOP</b><br>
            <small style="color: #888;">XUSH KELIBSIZ <span id="username-display">Foydalanuvchi</span></small>
        </div>
        <div style="background: #1a1a1a; padding: 6px 14px; border-radius: 20px; border: 1px solid #ff2222;">
            <span id="user-balance" style="color: #ff5555; font-weight: bold;">0</span> so'm
        </div>
    </div>
