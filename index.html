<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FKS PUBGM SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        body { 
            font-family: 'Orbitron', sans-serif; 
            background-color: #0b0e14; 
            color: #fff; 
        }
        .card-bg { background: rgba(22, 27, 34, 0.9); border: 1px solid rgba(239, 68, 68, 0.35); }
        .gradient-btn { background: linear-gradient(135deg, #dc2626, #991b1b); }
        .glow-red { box-shadow: 0 0 20px rgba(220, 38, 38, 0.4); }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <div class="p-3 card-bg border-b border-red-900/50 sticky top-0 z-40 flex justify-between items-center">
        <div>
            <h1 class="font-black text-xs text-red-500">FKS PUBGM SHOP <i class="fa-solid fa-gamepad"></i></h1>
            <p class="text-[10px] text-gray-400">XUSH KELIBSIZ <span id="username" class="text-red-400 font-bold">Foydalanuvchi</span></p>
        </div>
        <div class="text-[10px] bg-red-950 px-2 py-1 rounded text-red-300 border border-red-800" id="user-balance-header">0 so'm</div>
    </div>

    <!-- Balansni To'ldirish Bo'limi (Rasmda ko'rsatilganidek) -->
    <div class="p-3">
        <h2 class="text-sm font-black text-red-500 mb-3 uppercase">Balansni to'ldirish</h2>

        <!-- Qo'llanma -->
        <div onclick="openGuide()" class="card-bg p-3.5 rounded-2xl mb-2.5 flex justify-between items-center cursor-pointer hover:border-red-500 transition">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500 flex items-center justify-center text-blue-400">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                <div class="text-xs font-bold text-white">Qo'llanma</div>
            </div>
            <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
        </div>

        <!-- Avto Karta (Click & Payme uchun) -->
        <div onclick="openPaymentModal('Avto Karta (Click / Payme)')" class="card-bg p-3.5 rounded-2xl mb-2.5 flex justify-between items-center cursor-pointer hover:border-red-500 transition">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-red-600/20 border border-red-500 flex items-center justify-center text-red-400 font-bold text-[10px]">
                    UZS
                </div>
                <div>
                    <div class="text-xs font-bold text-white">AVTO KARTA</div>
                    <div class="text-[9px] text-gray-400">Click va Payme orqali</div>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
        </div>

        <!-- Bankamat / Terminal -->
        <div onclick="openPaymentModal('Bankamat')" class="card-bg p-3.5 rounded-2xl mb-2.5 flex justify-between items-center cursor-pointer hover:border-red-500 transition">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-green-600/20 border border-green-500 flex items-center justify-center text-green-400">
                    <i class="fa-solid fa-building-columns"></i>
                </div>
                <div>
                    <div class="text-xs font-bold text-white">BANKAMAT</div>
                    <div class="text-[9px] text-gray-400">Naqd pul / Terminal</div>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
        </div>
    </div>

    <!-- To'lov Modal Oynasi -->
    <div id="modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end justify-center">
        <div class="card-bg w-full max-w-md rounded-t-3xl p-4 border-t border-red-900">
            <div class="flex justify-between items-center mb-3">
                <h3 id="modal-title" class="font-bold text-xs text-red-500 uppercase">To'ldirish</h3>
                <i class="fa-solid fa-xmark text-gray-400 cursor-pointer" onclick="closeModal()"></i>
            </div>
            <div class="bg-gray-900 p-3 rounded-xl border border-red-900/50 mb-3 text-xs">
                <div class="text-[10px] text-gray-400">Karta raqami:</div>
                <div class="font-black text-white mt-0.5">6262 5708 2039 1383</div>
                <div class="text-[9px] text-red-400 mt-0.5">RAVSHANOVA XULKAR ISRAILOV</div>
            </div>
            <input type="number" id="amount" placeholder="Summani kiriting (so'm)..." class="w-full bg-gray-900 border border-red-900/50 rounded-xl p-2.5 text-xs text-white mb-3 focus:outline-none">
            
            <!-- Click va Payme tugmalari -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="sendTopup('Click')" class="bg-blue-600/20 border border-blue-500 text-blue-400 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-bolt"></i> Click orqali
                </button>
                <button onclick="sendTopup('Payme')" class="bg-teal-600/20 border border-teal-500 text-teal-400 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-wallet"></i> Payme orqali
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="fixed bottom-0 left-0 right-0 card-bg border-t border-red-900/50 p-2 flex justify-around items-center text-[10px] text-gray-400 z-40">
        <div onclick="location.href='index.html'" class="flex flex-col items-center text-red-500 cursor-pointer"><i class="fa-solid fa-house text-sm"></i><span>Bosh</span></div>
        <div onclick="location.href='index.html'" class="flex flex-col items-center cursor-pointer"><i class="fa-solid fa-wallet text-sm"></i><span>To'ldirish</span></div>
        <div class="flex flex-col items-center -mt-4"><div onclick="openPaymentModal('Balans')" class="w-10 h-10 gradient-btn text-white rounded-full flex items-center justify-center shadow text-base cursor-pointer border-2 border-[#0b0e14]"><i class="fa-solid fa-plus"></i></div></div>
        <div onclick="alert('Buyurtmalar yo`q')" class="flex flex-col items-center cursor-pointer"><i class="fa-solid fa-clock-rotate-left text-sm"></i><span>Tarix</span></div>
        <div onclick="alert('Profil')" class="flex flex-col items-center cursor-pointer"><i class="fa-solid fa-user text-sm"></i><span>Profil</span></div>
    </div>

    <script>
        let uid = "default";
        let userName = "Foydalanuvchi";
        let selectedMethod = "Karta";

        window.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp; tg.ready();
            if(tg.initDataUnsafe && tg.initDataUnsafe.user) {
                uid = String(tg.initDataUnsafe.user.id);
                userName = tg.initDataUnsafe.user.first_name || "Foydalanuvchi";
                document.getElementById('username').innerText = userName;
            }
            fetchBal();
        });

        function fetchBal() {
            fetch(`/api/balance?user_id=${uid}`).then(r => r.json()).then(d => {
                document.getElementById('user-balance-header').innerText = d.balance.toLocaleString() + " so'm";
            });
        }

        function openPaymentModal(method) {
            selectedMethod = method;
            document.getElementById('modal-title').innerText = method + " orqali to'ldirish";
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function openGuide() {
            alert("Qo'llanma: Summani kiriting, ko'rsatilgan karta raqamiga pul o'tkazing va Click yoki Payme tugmasini bosing. Admin tezda tasdiqlaydi!");
        }

        function sendTopup(method) {
            let am = document.getElementById('amount').value;
            if(!am || am <= 0) { alert("Summani kiriting!"); return; }
            
            fetch('/api/topup', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({user_id: uid, amount: am, username: userName, payment_method: `${selectedMethod} (${method})`}) 
            })
            .then(r => r.json()).then(d => {
                if(d.success) { 
                    closeModal(); 
                    alert(`${method} orqali ${Number(am).toLocaleString()} so'm so'rovi yuborildi! Admin tasdiqlagach balansingizga qo'shiladi.`); 
                }
            });
        }
    </script>
</body>
</html>
