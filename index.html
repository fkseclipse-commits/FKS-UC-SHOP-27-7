<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FKS PUBG SHOP</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161616;
            border-bottom: 1px solid #222;
        }
        .container {
            padding: 15px;
        }
        .menu-btn {
            background: #1c1c1c;
            border: 1px solid #333;
            color: white;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #161616;
            border: 1px solid #333;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .input-box {
            width: 100%;
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .action-btn {
            background: #ffaa00;
            color: black;
            font-weight: bold;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .card-number {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffcc00;
            margin: 10px 0;
            cursor: pointer;
        }
        .timer {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ff4444;
            margin: 10px 0;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        .nav-item {
            color: #888;
            text-align: center;
            font-size: 12px;
            text-decoration: none;
        }
        .nav-item.active {
            color: #ffaa00;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <b>FKS PUBG SHOP</b><br>
            <small style="color: #888;">XUSH KELIBSIZ <span id="username-display">Foydalanuvchi</span></small>
        </div>
        <div style="background: #222; padding: 5px 12px; border-radius: 20px; border: 1px solid #444;">
            <span id="user-balance">0</span> so'm
        </div>
    </div>

    <div class="container" id="tab-toldirish">
        <h3>BALANSNI TO'LDIRISH</h3>
        <button class="menu-btn" onclick="openModal()">
            <span>💳 AVTO KARTA (Click / Payme)</span>
            <span>›</span>
        </button>
    </div>

    <!-- Modal / Karta oynasi -->
    <div class="modal" id="payModal">
        <div class="modal-content" id="modalBody">
            <h3 style="margin-top:0;">TO'LDIRISH SUMMASI (SO'M)</h3>
            <p style="font-size: 12px; color: #888;">Tasdiqlash: soniyalar ichida</p>
            <input type="number" id="amount" class="input-box" placeholder="Masalan: 12000">
            <button class="action-btn" onclick="generateCard()">Karta olish</button>
            <button onclick="closeModal()" style="background:transparent; border:none; color:#888; width:100%; margin-top:10px; cursor:pointer;">Bekor qilish</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active" onclick="switchTab('toldirish')">
            <div>➕</div>
            <div>To'ldirish</div>
        </a>
    </div>

    <script>
        let uid = Telegram.WebApp.initDataUnsafe?.user?.id || "12345678";
        let userName = Telegram.WebApp.initDataUnsafe?.user?.first_name || "Foydalanuvchi";
        document.getElementById('username-display').innerText = userName;

        function fetchBalance() {
            fetch(`/api/balance?user_id=${uid}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('user-balance').innerText = Number(data.balance).toLocaleString();
            });
        }
        fetchBalance();
        setInterval(fetchBalance, 5000);

        function openModal() {
            document.getElementById('payModal').style.display = 'flex';
            document.getElementById('modalBody').innerHTML = `
                <h3 style="margin-top:0;">TO'LDIRISH SUMMASI (SO'M)</h3>
                <p style="font-size: 12px; color: #888;">Tasdiqlash: soniyalar ichida</p>
                <input type="number" id="amount" class="input-box" placeholder="Masalan: 12000">
                <button class="action-btn" onclick="generateCard()">Karta olish</button>
                <button onclick="closeModal()" style="background:transparent; border:none; color:#888; width:100%; margin-top:10px; cursor:pointer;">Bekor qilish</button>
            `;
        }

        function closeModal() {
            document.getElementById('payModal').style.display = 'none';
        }

        let timerInterval;
        function generateCard() {
            let am = document.getElementById('amount').value;
            if(!am || am <= 1000) { alert("Iltimos, to'g'ri summa kiriting!"); return; }

            // Serverga so'rov yuborish (Adminga xabar va tugma borishi uchun)
            fetch('/api/topup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: uid, amount: am, username: userName, payment_method: 'Avto Karta'})
            });

            let cardNum = "6262570820391383";
            let cardHolder = "RAVSHANOVA XULKAR ISRAILOV";
            
            document.getElementById('modalBody').innerHTML = `
                <div style="font-size: 12px; color: #888;">Avto karta <span style="float:right; background:#d4af37; color:black; padding:2px 6px; border-radius:4px; font-weight:bold;">HUMO / UZCARD</span></div>
                <div class="card-number" onclick="copyCard('${cardNum}')" title="Nusxalash uchun bosing">${cardNum.match(/.{1,4}/g).join(' ')} 📋</div>
                <div style="font-size: 12px; color: #ccc;">${cardHolder}</div>
                <hr style="border-color:#333; margin:12px 0;">
                <div style="font-size: 12px; color: #888;">ANIQ SHU SUMMANI O'TKAZING</div>
                <div style="font-size: 22px; font-weight: bold; color: #ffcc00; margin: 5px 0;">${Number(am).toLocaleString()} so'm</div>
                <div style="font-size: 12px; color: #888;">Qolgan vaqt</div>
                <div class="timer" id="countdown">05:00</div>
                <div style="text-align:center; font-size: 13px; color: #ffaa00; margin: 10px 0;">⏳ To'lovingiz kutilmoqda...</div>
                <button class="action-btn" style="background:#222; color:white; border:1px solid #444; margin-top:5px;" onclick="openModal()">Bekor qilish / Boshqa summa</button>
            `;

            startTimer(300);
        }

        function copyCard(num) {
            navigator.clipboard.writeText(num);
            alert("Karta raqami nusxalandi!");
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            clearInterval(timerInterval);
            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                let timerElement = document.getElementById('countdown');
                if(timerElement) {
                    timerElement.textContent = minutes + ":" + seconds;
                }

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    if(timerElement) timerElement.textContent = "Vaqt tugadi!";
                }
            }, 1000);
        }
    </script>
</body>
</html>
